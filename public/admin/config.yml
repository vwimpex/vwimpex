- name: categories
  label: Catalog · Categories
  folder: data/categories
  extension: yaml
  format: yaml
  create: true
  identifier_field: name
  slug: '{{fields.slug}}'
  summary: '{{name}}'
  sortable_fields:
  - weight
  - name
  fields:
  - label: Category name
    name: name
    widget: string
  - label: URL slug
    name: slug
    widget: string
    hint: 'URL: /products/category/<slug>. Do not change for existing categories.'
    pattern:
    - ^[a-z0-9-]+$
    - lowercase letters, numbers and - only
  - label: Menu order
    name: weight
    widget: number
    value_type: int
  - label: Icon
    name: icon
    widget: select
    options:
    - arrow
    - award
    - ball
    - box
    - cart
    - check
    - chevron
    - clamp
    - clock
    - close
    - clutch
    - coupling
    - facebook
    - gear
    - globe
    - grid
    - handshake
    - headset
    - linear
    - linkedin
    - lock
    - mail
    - menu
    - parts
    - phone
    - pin
    - ring
    - roller
    - search
    - shield
    - star
    - tag
    - target
    - thrust
    - tool
    - truck
    - user
    - users
  - label: Short text (home card)
    name: blurb
    widget: string
  - label: Description (category page)
    name: description
    widget: text
    required: false
  - label: Image
    name: image
    widget: image
    required: false
  - label: Sub-categories
    name: subcategories
    widget: list
    fields:
    - label: Name
      name: name
      widget: string
    - label: URL slug
      name: slug
      widget: string
      hint: 'URL: /products/category/<category>/<slug>. Do not change for existing ones.'
    - label: Page heading (optional)
      name: heading
      widget: string
      required: false
    - label: Description
      name: description
      widget: text
      required: false
    - label: Image
      name: image
      widget: image
      required: false
    summary: '{{fields.name}}'
    collapsed: true
- name: brands
  label: Catalog · Brands
  folder: content/brand
  create: true
  slug: '{{fields.slug}}'
  filter:
    field: entry_type
    value: brand
  summary: '{{title}}'
  sortable_fields:
  - title
  fields:
  - label: Entry type
    name: entry_type
    widget: hidden
    default: brand
  - label: Brand name
    name: title
    widget: string
  - label: URL slug
    name: slug
    widget: string
    hint: 'URL: /brand/<slug>. Do not change for existing brands.'
    pattern:
    - ^[a-z0-9-]+$
    - lowercase letters, numbers and - only
  - label: Logo
    name: logo
    widget: image
    required: false
  - label: Meta description (Google)
    name: description
    widget: text
    required: false
  - label: Brand description
    name: body
    widget: markdown
    required: false
- name: products
  label: Catalog · Products (added / edited)
  folder: content/product
  create: true
  slug: '{{fields.slug}}'
  filter:
    field: entry_type
    value: product
  summary: '{{title}}  ·  {{cat}}'
  sortable_fields:
  - title
  - brand
  description: 'New products, and existing products you edit. To edit an existing product, open it on the website and click "Edit this product in CMS" (visible after you have opened /admin once in this
    browser). Bulk changes: use the Excel import (see README).'
  fields:
  - label: Entry type
    name: entry_type
    widget: hidden
    default: product
  - label: Product title
    name: title
    widget: string
    hint: Usually "BRAND - PART NUMBER", e.g. SKF - 6205-2RS
  - label: URL slug
    name: slug
    widget: string
    hint: 'URL: /product/<slug>. Keep the old value when editing an existing product.'
    pattern:
    - ^[a-z0-9-]+$
    - lowercase letters, numbers and - only
  - label: Brand
    name: brand
    widget: string
  - label: Part number
    name: part
    widget: string
  - label: Category
    name: cat
    widget: select
    options:
    - label: Ball Bearings
      value: ball-bearings
    - label: Roller Bearings
      value: roller-bearings
    - label: Special Bearings
      value: special-bearings
    - label: Housings
      value: housings
    - label: Linear Bearings
      value: linear-bearings
    - label: Seals & Snap Rings
      value: sealssnap-rings
    - label: Thrust Bearings
      value: thrust-bearings
    - label: Couplings
      value: couplings
    - label: Clutch and Brakes
      value: clutch-and-brakes
    - label: Parts for Bearings
      value: parts-for-bearings
    - label: Tools for Bearings
      value: tools-for-bearings
    - label: Power Transmission
      value: power-transmission
    - label: Clamping Element
      value: clamping-element
    - label: Gearbox
      value: gearbox
    - label: Skate Bearings & Accessories
      value: roller-and-inline-skates-accessories
    - label: Bearing Accessories
      value: bearing-accessories
  - label: Sub-category slug
    name: sub
    widget: string
    required: false
    hint: e.g. ceramic-bearing – see Catalog · Categories
  - label: Product type (shown on page)
    name: subName
    widget: string
    required: false
  - label: Price (INR, excl. GST) – leave empty for "Get a Quote"
    name: price
    widget: number
    value_type: float
    required: false
  - label: Inner diameter (e.g. 25 mm)
    name: di
    widget: string
    required: false
  - label: Outer diameter (e.g. 52 mm)
    name: do
    widget: string
    required: false
  - label: Width (e.g. 15 mm)
    name: w
    widget: string
    required: false
  - label: Length
    name: l
    widget: string
    required: false
  - label: Weight (kg)
    name: kg
    widget: string
    required: false
  - label: Bore
    name: bore
    widget: string
    required: false
  - label: Cage
    name: cage
    widget: string
    required: false
  - label: Seal
    name: seal
    widget: string
    required: false
  - label: Lubrication
    name: lub
    widget: string
    required: false
  - label: Minimum order qty
    name: moq
    widget: string
    required: false
  - label: HSN code
    name: hsn
    widget: string
    required: false
  - label: Image
    name: img
    widget: image
    required: false
  - label: Datasheet PDF
    name: pdf
    widget: file
    required: false
  - label: Description
    name: desc
    widget: text
    required: false
  - label: Technical details
    name: tech
    widget: text
    required: false
  - label: Hide this product
    name: draft
    widget: boolean
    default: false
    required: false
