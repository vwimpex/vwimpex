# Decap CMS configuration (same CMS as the Bionic site). Login: Netlify Identity + Git Gateway (see README).
# Local testing: run `npx decap-server` + `hugo server`, then open http://localhost:1313/admin/
backend:
  name: git-gateway
  branch: main
local_backend: true
editor:
  preview: false
site_url: https://vwimpex.com
display_url: https://vwimpex.com
logo_url: /images/uploads/logo.webp
media_folder: static/images/uploads
public_folder: /images/uploads
publish_mode: simple
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: pages
  label: Pages
  files:
  - name: home
    label: Home page
    file: content/_index.md
    fields:
    - label: Page title (browser tab & Google)
      name: title
      widget: string
    - label: Meta description (Google snippet)
      name: description
      widget: text
      required: false
    - label: "Hero (top banner)"
      name: hero
      widget: object
      fields:
      - label: Background photo
        name: image
        widget: image
        required: false
        hint: "Wide photo (1920×800 or larger). Default is the bearing photo on CloudFront."
      - label: Small label
        name: eyebrow
        widget: string
      - label: Heading (line 1, white)
        name: heading
        widget: string
      - label: Heading (line 2, light blue)
        name: headingAccent
        widget: string
      - label: Intro text
        name: lead
        widget: text
      - label: Search box label (screen readers)
        name: searchLabel
        widget: string
      - label: Search box placeholder
        name: searchPlaceholder
        widget: string
      - label: Search button text
        name: searchButton
        widget: string
      - label: Search suggestions (small chips under the search box)
        name: suggestions
        widget: list
        fields:
          - {label: Text on chip, name: label, widget: string}
          - {label: Search for, name: query, widget: string}
      - label: Main button text (Get a Quote)
        name: primaryButton
        widget: string
      - label: Second button text (scrolls to categories)
        name: secondaryButton
        widget: string
    - label: Categories section
      name: categories
      widget: object
      fields:
      - label: Small label
        name: eyebrow
        widget: string
      - label: Heading
        name: heading
        widget: string
      - label: Intro text
        name: text
        widget: text
      - label: Link text (top right)
        name: linkText
        widget: string
      - label: Word after the product count
        name: countLabel
        widget: string
    - label: Brands section (logos come from Featured brands in Shared sections)
      name: brands
      widget: object
      fields:
      - label: Small label
        name: eyebrow
        widget: string
      - label: Heading
        name: heading
        widget: string
      - label: Link text
        name: linkText
        widget: string
