      - label: Small label
        name: eyebrow
        widget: string
      - label: Heading
        name: heading
        widget: string
      - label: Steps (3 recommended)
        name: items
        widget: list
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Text, name: text, widget: text}
    - label: Values section (the 5 values come from Shared sections → Our values)
