<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>VW Impex | Content Manager</title>
  <!-- Login: Netlify Identity (invite editors in Netlify → Site → Identity) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    // Marks this browser as an editor so "Edit in CMS" links show on the live site
    try { localStorage.setItem('vw-editor', '1'); } catch (e) {}
  </script>
  <!-- Decap CMS (same CMS as the Bionic site). Config: /admin/config.yml -->
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
</body>
</html>
