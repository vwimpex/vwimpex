<section class="cta-band">
  <div class="container cta-inner">
    <div>
      <h2>Have a part number? Get a price today.</h2>
      <p>Send us the part number, brand or a photo. We reply with price and delivery time, usually within one business day.</p>
    </div>
    <div class="cta-actions">
      <a class="btn btn-light" href="{{ "/getQuote" | relURL }}">Request a quote {{ partial "icon.html" (dict "name" "arrow" "size" 18) }}</a>
      <a class="btn btn-outline-light" href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
    </div>
  </div>
</section>
